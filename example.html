<!DOCTYPE html>
<html lang="en" class="bg-white dark:bg-gray-950 scheme-light dark:scheme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@validform/validform</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@validform/validform@1.0.2/validform.min.js"></script>
  <style>
    .btn[disabled] {
      --tw-border-opacity: 0;
      background-color: color-mix(in oklab, var(--color-indigo-600) 50%, transparent);
      --tw-bg-opacity: 0.2;
      --tw-text-opacity: 0.2;
    }
  </style>
</head>
<body>
  <main class="min-h-dvh flex items-center justify-center p-4 md:p-8">
    <form>
      <div class="space-y-12">
        <div class="border-b border-gray-900/10 pb-12 dark:border-white/10">
          <h2 class="text-base/7 font-semibold text-gray-900 dark:text-white">Example</h2>
          <p class="mt-1 text-sm/6 text-gray-600 dark:text-gray-400">
            This form is an example of using
            <a href="https://valid-form-js.cozedev.com" target="_blank" rel="noopener noreferrer" class="text-blue-600">@validform/validform</a>
            with
            <a href="https://tailwindcss.com" target="_blank" rel="noopener noreferrer" class="text-blue-600">Tailwind CSS</a>.
            <a href="https://github.com/SebastienCozeDev/valid-form-js/blob/main/example.html" target="_blank" rel="noopener noreferrer" class="text-blue-600">View the code</a>.
          </p>

          <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
            <div class="sm:col-span-4">
              <label for="username" class="chars-3-min chars-20-max block text-sm/6 font-medium text-gray-900 dark:text-white">
                Username
                <div class="mt-2">
                  <div class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600 dark:bg-white/5 dark:outline-white/10 dark:focus-within:outline-indigo-500">
                    <div class="shrink-0 text-base text-gray-500 select-none sm:text-sm/6 dark:text-gray-400">workcation.com/</div>
                    <input id="username" type="text" name="username" placeholder="janesmith" class="block min-w-0 grow bg-white py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:bg-transparent dark:text-white dark:placeholder:text-gray-500" />
                  </div>
                </div>
                <p class="chars-3-min text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The username must contain at least 3 characters.
                </p>
                <p class="chars-20-max text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The username must contain a maximum of 32 characters.
                </p>
              </label>
            </div>
          </div>
        </div>

        <div class="border-b border-gray-900/10 pb-12 dark:border-white/10">
          <h2 class="text-base/7 font-semibold text-gray-900 dark:text-white">Personal Information</h2>
          <p class="mt-1 text-sm/6 text-gray-600 dark:text-gray-400">Use a permanent address where you can receive mail.</p>

          <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
            <div class="sm:col-span-3">
              <label for="first-name" class="chars-3-min chars-20-max block text-sm/6 font-medium text-gray-900 dark:text-white">
                First name
                <div class="mt-2">
                  <input id="first-name" type="text" name="first-name" autocomplete="given-name" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                </div>
                <p class="chars-3-min text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The first name must contain at least 3 characters.
                </p>
                <p class="chars-20-max text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The first name must contain a maximum of 32 characters.
                </p>
              </label>
            </div>

            <div class="sm:col-span-3">
              <label for="last-name" class="chars-3-min chars-20-max block text-sm/6 font-medium text-gray-900 dark:text-white">
                Last name
                <div class="mt-2">
                  <input id="last-name" type="text" name="last-name" autocomplete="family-name" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                </div>
                <p class="chars-3-min text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The last name must contain at least 3 characters.
                </p>
                <p class="chars-20-max text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The last name must contain a maximum of 32 characters.
                </p>
              </label>
            </div>

            <div class="sm:col-span-4">
              <label for="email" class="valid-email block text-sm/6 font-medium text-gray-900 dark:text-white">
                Email address
                <div class="mt-2">
                  <input id="email" type="email" name="email" autocomplete="email" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                </div>
                <p class="valid-email text-red-500 mt-2 ml-1 align-items-center gap-2 flex items-center overflow-hidden transition-all duration-700 ease-in-out max-h-0 opacity-0 -translate-y-2 pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                  The email address must be valid.
                </p>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-6 flex items-center justify-end gap-x-6">
        <button type="button" class="text-sm/6 font-semibold text-gray-900 dark:text-white">Cancel</button>
        <button type="submit" class="btn rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:shadow-none dark:focus-visible:outline-indigo-500" disabled>Save</button>
      </div>
    </form>
  </main>
</body>
</html>
